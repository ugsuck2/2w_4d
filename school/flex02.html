<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .blue{
            background-color: blue;
            width: 200px;
            height: 200px;
        }
        .red{
            background-color: red;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
        }
        .green {
            background-color: green;
            width: 100px;
            height: 200px;
        }
        .orange {
            background-color: orange;
            width: 100px;
            height: 200px;

            display: flex;
        }
        .box1 {
            display: flex;
        }
        .purple {
            background-color: purple;
            height: 50%;
            width: 50%;
        }
        .pink {
            background-color: pink;
            height: 50%;
            width: 50%;
        }

        .left {
            width: 100px;
            height: 50px;
            background-color: red;
        }
        .right {
            width: 100px;
            height: 50px;
            background-color: blue;
        }

        .nav {
            display: flex;
            justify-content: space-between;
        }





    </style>
</head>
<body>
    
    <div class="box1">
    <div class="blue"></div>
    <div class="red">
        <div class="green"></div>
        <div class="orange">
            <div class="purple"></div>
            <div class="pink"></div>
        </div>
    
    </div>
    </div>

    <div class="nav">
        <div class="left"></div>
        <div class="right"></div>
    </div>
    
    
</body>
</html>
