<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;

            flex-flow: row wrap;

            /* flex-direction: column-reverse; */
            /* 주축정렬 */
            justify-content: space-between;

            /* 교차축정렬 */
            align-items: center;
            /* align-content: center; */

            height: 400px;
            background-color: lightblue;



        }
        .item {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .content-center{
            display: flex;
            justify-content: center; /* 가로축 가운데 */
            align-items: center;     /* 세로축 가운데 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item content-center">2</div>
        <div class="item content-center">3</div>
        <div class="item content-center">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
</body>
</html>
