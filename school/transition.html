<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: purple;
            margin: 20px;
            /* transition-property: width background-color; */
            transition-property: all;
            transition-duration: 3s;

            /* transition-delay: 0.5s; */
        }
        /* 기존에 보유한 속성값 ----> 변경될 속성값*/

        /* 전환 효과를 주는게 transition */
            /* transition 속성 위치
            기존    :  마우스 올릴때 o 내릴때 o
            hover  : 마우스 올릴때 o 내릴때 x */


        .box:hover {
            width: 300px;
            background-color: aquamarine;
        }
        .container:hover .box {
            width: 300px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <div class="container">
        <div class="box" style="transition-timing-function: linear;"></div>
        <div class="box" style="transition-timing-function: ease;"></div>
        <div class="box" style="transition-timing-function: cubic-bezier(0.79, 0.26, 1, 0.24);"></div>
        <div class="box" style="transition-timing-function: ease-in;"></div>
        <div class="box" style="transition-timing-function: ease-out;"></div>
        <div class="box" style="transition-timing-function: ease-in-out;"></div>
    </div>

</body>
</html>
