<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 800px;
            height: 500px;
            background-color: antiquewhite;
            margin: 0 auto;
        }
        .header {
            display: flex;
        }
        .header-left {
            width: 400px;
            height: 100px;
            background-color: yellow;
        }
        .header-right {
            width: 400px;
            height: 100px;
            background-color: gray;
        }
        .purple-box {
            width: 800px;
            height: 100px;
            background-color: purple;
        }
        .blue-box {
            width: 300px;
            height: 200px;
            background-color: blue;
        }
        .yellow-long-box {
            width: 500px;
            height: 100px;
            background-color: yellow;
        }
        .flex {
            display: flex;
        }
        .pink-box {
            width: 500px;
            height: 100px;
            background-color: rgb(147, 48, 64);
        }
        .foot{
            display: flex;
        }
        .foot1 {
            width: 200px;
            height: 100px;
            background-color: yellow;
        }
        .foot2 {
            width: 200px;
            height: 100px;
            background-color: orange;
        }
        .foot3 {
            width: 200px;
            height: 100px;
            background-color: green;
        }
        
    </style>
</head>
<body>
    
    
    <div class="container">
        <div class="header">
        <div class="header-left"></div>
        <div class="header-right"></div>
        </div>
        <div class="purple-box"></div>
        <div class="flex">
            <div class="blue-box"></div>
            <div>
            <div class="yellow-long-box"></div>
            <div class="pink-box"></div>
            </div>
        </div>
        <div class="foot">
            <div class="foot1"></div>
            <div class="foot2"></div>
            <div class="foot1"></div>
            <div class="foot3"></div>

        </div>

    </div>


</body>
</html>
