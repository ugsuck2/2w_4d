<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-box{
            width: 800px;
            margin: 100px auto;
            border: 5px solid black;
            
            box-sizing: border-box;
            border-collapse: collapse;
            position: relative;
            
        }
        .top-container{
            
            
            justify-content: center;
            align-items: center;
        }
        .first-yellow-box {
            width: 400px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
            box-sizing: border-box;
            
        }
        .first-gray-box {
            width: 400px;
            height: 100px;
            background-color: gray;
            border: 1px solid black;
            box-sizing: border-box;
            
        }
        .purple-box {
            width: 800px;
            height: 100px;
            background-color: purple;
            border: 1px solid black;
            box-sizing: border-box;
            
        }
        .blue-box {
            width: 300px;
            height: 200px;
            background-color: blue;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .second-yellow-box {
            width: 500px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .carrot-box {
            width: 500px;
            height: 100px;
            background-color: rgb(220, 135, 213);
            border: 1px solid black;
            box-sizing: border-box;
        }
        .middle {
            display: flex;
        }
        .bottom {
            display: flex;
        }
        .bottom-yellow-box {
            width: 200px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .bottom-orange-box {
            width: 200px;
            height: 100px;
            background-color: orange;
            border: 1px solid black;
            box-sizing: border-box;
        }
        .bottom-greem-box {
            width: 200px;
            height: 100px;
            background-color: green;
            border: 1px solid black;
            box-sizing: border-box;
        }
    
    </style>
</head>
<body>
    <div class="top-container">
    <div class="main-box">
        <div class="middle">
            <div class="first-yellow-box"></div>
            <div class="first-gray-box"></div>
        </div>
        <div class="middle">
            <div class="purple-box"></div>
        </div>
        <div class="middle">
            <div class="blue-box"></div>
            <div>
                <div class="second-yellow-box"></div>
                <div class="carrot-box"></div>
            </div>
        </div>
        <div class="middle">
            <div class="bottom-yellow-box"></div>
            <div class="bottom-orange-box"></div>
            <div class="bottom-yellow-box"></div>
            <div class="bottom-greem-box"></div>
        </div>
    </div>    

    </div>
    
</body>
</html>
